plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.unreelblocker'
version = '0.1.0'

android {
  namespace "expo.modules.unreelblocker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM unit tests for the detection rules (no device needed): ./gradlew :unreel-blocker:test
  testImplementation 'junit:junit:4.13.2'
  // android.jar's org.json is a stub on the JVM; use the real implementation in unit tests.
  testImplementation 'org.json:json:20240303'
}

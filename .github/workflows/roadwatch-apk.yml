# Builds an installable RoadWatch APK on GitHub's servers.
# First add your Google Maps key as a repository secret named GOOGLE_MAPS_API_KEY
# (Settings → Secrets and variables → Actions), then: Actions → "RoadWatch APK" → Run workflow,
# and download the "roadwatch-apk" artifact when it finishes (about 15–20 minutes).
name: RoadWatch APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'roadwatch/**'
      - '.github/workflows/roadwatch-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: roadwatch
    env:
      # Read by app.config.ts (native map key) and inlined into the JS bundle (search, routes).
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roadwatch/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check for the Google Maps key
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY secret is not set, so the map will be blank in this APK. See roadwatch/README.md."
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Tests and typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Expo's template signs release builds with the debug keystore, so this APK installs
      # directly on a phone. For the Play Store, build an .aab signed with your own key instead.
      - name: Build release APK
        working-directory: roadwatch/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: roadwatch-apk
          path: roadwatch/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
